name: Quality gates
on:
  push:
    branches: [main, 'develop/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: G2-G5 data and logic
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: G3-G6 sequential browser acceptance
        run: python tests/browser.py
      - name: Save QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: |
            docs/G2-results.json
            docs/browser-results.json
            docs/qa-artifacts/*.png
          if-no-files-found: warn

  package:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: qa
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure publishing source
        uses: actions/configure-pages@v5
      - name: Prepare static site only
        run: |
          mkdir -p _site
          cp index.html style.css app.js core.js sw.js manifest.webmanifest icon.svg .nojekyll _site/
          cp -R data _site/data
          test -s _site/index.html
          test -s _site/data/vocabulary.json
      - name: Select unique artifact name for this attempt
        id: artifact-name
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: ${{ steps.artifact-name.outputs.name }}
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for artifact metadata to propagate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.package.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_NAME"
          test -n "$ARTIFACT_ID"
          for attempt in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate | jq -e --arg name "$ARTIFACT_NAME" --arg id "$ARTIFACT_ID" '.artifacts[] | select(.name == $name and (.id | tostring) == $id and .expired == false and .size_in_bytes > 0)' > /dev/null; then
              echo "Artifact $ARTIFACT_NAME ($ARTIFACT_ID) is visible via REST API."
              # The Pages deploy action uses a separate artifact metadata service.
              sleep 30
              exit 0
            fi
            echo "Artifact not visible yet: attempt $attempt/12"
            sleep 10
          done
          echo "::error::Pages artifact did not become visible."
          exit 1
      - name: Deploy after QA and artifact readiness pass
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.package.outputs.artifact_name }}
  verify-live:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live smoke dependencies
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: G7 verify deployed content and real browser
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python tests/live.py
