name: Quality gates
on:
  push:
    branches: [main, 'develop/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: G2-G5 data and logic
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: G3-G6 sequential browser acceptance
        run: python tests/browser.py
      - name: Save QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: |
            docs/G2-results.json
            docs/browser-results.json
            ${{ github.workspace }}/../efw_*_preview.png
          if-no-files-found: warn
